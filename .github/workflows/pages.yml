# Deploy the static site to GitHub Pages via Actions, bypassing the legacy
# Jekyll-era Pages builder that has been failing intermittently ("Page build
# failed" emails with byte-clean content; same commit builds on retry).
# The repo content is already the built site (deploy-pages.mjs pushes it),
# so this just uploads it verbatim.
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
